{% extends "base.html" %}
{% block title %}Server Error (500) — InsightDesk{% endblock %}

{% block body %}
<div class="auth-page" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;">
    <div class="glass-panel" style="padding: 48px; max-width: 500px; width: 100%; border-color: rgba(239, 68, 68, 0.3);">
        <div class="text-6xl mb-6">⚠️</div>
        <h1 class="text-3xl font-bold mb-4 text-red-400">500 - Internal Server Error</h1>
        <p class="text-gray-400 mb-8">Something went wrong on our end. We've logged the error and will look into it.</p>
        <a href="{{ url_for('analytics.index') if current_user.is_authenticated else url_for('index') }}" class="btn btn-ghost border-red-500/50 hover:bg-red-500/10 text-red-300">
            Return Home
        </a>
    </div>
</div>
{% endblock %}
