{% extends "base.html" %}
{% block title %}Page Not Found (404) — InsightDesk{% endblock %}

{% block body %}
<div class="auth-page" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;">
    <div class="glass-panel" style="padding: 48px; max-width: 500px; width: 100%;">
        <div class="text-6xl mb-6">🔍</div>
        <h1 class="text-3xl font-bold mb-4">404 - Page Not Found</h1>
        <p class="text-gray-400 mb-8">The page you're looking for doesn't exist or has been moved.</p>
        <a href="{{ url_for('analytics.index') if current_user.is_authenticated else url_for('index') }}" class="btn btn-primary">
            Return Home
        </a>
    </div>
</div>
{% endblock %}
